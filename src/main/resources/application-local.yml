    activate:
      on-profile: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mysociety}
  jpa:
    hibernate:
      ddl-auto: update
logging:
  level:
    com.mysociety.operations: INFO

